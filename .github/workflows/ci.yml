name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, and Prisma validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://ci:ci@database.invalid:5432/gpc_ci?schema=public
      DIRECT_URL: postgresql://ci:ci@database.invalid:5432/gpc_ci?schema=public
      AUTH_MODE: simple
      MVP_ACCESS_CODE: ci-only-placeholder
      MVP_SESSION_SECRET: ci-only-placeholder-secret-not-for-production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund --loglevel=error

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Validate Prisma schema
        run: npm run db:validate

      - name: Lint
        run: npm run lint -- --quiet

      - name: Typecheck
        run: npm run typecheck
